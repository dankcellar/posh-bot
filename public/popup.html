<!doctype html>
<html lang="en">
  <head>
    <title>Poshify</title>
    <meta content="text/html" charset="UTF-8" name="Poshify" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css"
      integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls"
      crossorigin="anonymous"
    />
  </head>
  <body style="width: 100%">
    <form class="pure-form pure-form-aligned" style="margin: 15px">
      <fieldset>
        <legend>Poshify</legend>
        <div class="pure-control-group">
          <button id="followButton" class="pure-button">Toggle Follow Mode</button>
        </div>
        <div class="pure-control-group">
          <button id="partyButton" class="pure-button">Toggle Party Mode</button>
        </div>
        <div class="pure-control-group">
          <label id="versionText">Version: ---</label>
        </div>
      </fieldset>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
